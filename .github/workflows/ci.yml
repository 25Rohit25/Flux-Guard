name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and integration tests
        run: mvn -B -ntp verify
      - name: Configure ephemeral Compose secrets
        run: |
          echo "JWT_SECRET=$(openssl rand -base64 32)" >> .env
          echo 'DB_PASSWORD=ci-database-password-123' >> .env
          echo 'ADMIN_EMAIL=admin@example.test' >> .env
          echo 'ADMIN_PASSWORD=ci-admin-password-123' >> .env
          echo 'GRAFANA_PASSWORD=ci-grafana-password-123' >> .env
          echo 'RATE_REPLENISH=1' >> .env
          echo 'RATE_BURST=20' >> .env
      - name: Start and test the Compose stack
        run: |
          docker compose up --build -d
          python3 scripts/smoke.py
      - name: Run steady and burst k6 scenarios
        run: |
          docker run --rm --network host -v "$PWD/load:/scripts:ro" \
            -e BASE_URL=http://127.0.0.1:8080 \
            -e EMAIL=load@example.test -e PASSWORD=load-password-123 \
            -e FLUXGUARD_RATE=1 -e FLUXGUARD_DURATION=30s \
            grafana/k6:2.1.0 run /scripts/load.js
          docker run --rm --network host -v "$PWD/load:/scripts:ro" \
            -e BASE_URL=http://127.0.0.1:8080 \
            -e EMAIL=load@example.test -e PASSWORD=load-password-123 \
            grafana/k6:2.1.0 run /scripts/rate-limit.js
      - name: Check monitoring targets and dashboard
        run: python3 scripts/monitoring_check.py
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop Compose stack
        if: always()
        run: docker compose down -v
