server:
  port: 8083
spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fluxguard}
    username: ${DB_USER:fluxguard}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
fluxguard:
  jwt-secret: ${JWT_SECRET}
  product-url: ${PRODUCT_URL:http://localhost:8082}
logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
