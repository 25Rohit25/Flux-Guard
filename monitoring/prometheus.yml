global:
  scrape_interval: 10s
scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [gateway:9090]
  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [user-service:8081]
  - job_name: product-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [product-service:8082]
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [order-service:8083]
