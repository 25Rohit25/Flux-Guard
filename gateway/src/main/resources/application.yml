server:
  port: 8080
spring:
  application:
    name: fluxguard-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: ${USER_URL:http://localhost:8081}
              predicates:
                - Path=/auth/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: users
                    fallbackUri: forward:/fallback/users
            - id: users
              uri: ${USER_URL:http://localhost:8081}
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: users
                    fallbackUri: forward:/fallback/users
            - id: products
              uri: ${PRODUCT_URL:http://localhost:8082}
              predicates:
                - Path=/api/products/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: products
                    fallbackUri: forward:/fallback/products
            - id: orders
              uri: ${ORDER_URL:http://localhost:8083}
              predicates:
                - Path=/api/orders/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: orders
                    fallbackUri: forward:/fallback/orders
          httpclient:
            connect-timeout: 1000
            response-timeout: 3s
          metrics:
            enabled: true
fluxguard:
  jwt-secret: ${JWT_SECRET}
  rate:
    replenish: ${RATE_REPLENISH:10}
    burst: ${RATE_BURST:100}
management:
  server:
    port: 9090
  metrics:
    distribution:
      percentiles-histogram:
        spring.cloud.gateway.requests: true
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
